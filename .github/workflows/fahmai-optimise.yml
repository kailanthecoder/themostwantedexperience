name: Optimise A4 proposal assets
on:
  push:
    paths: ['.github/workflows/fahmai-optimise.yml']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - run: python proposals/fah-mai/optimise.py
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add proposals/fah-mai/index.html
          git diff --cached --quiet || (git commit -m "Optimize photo modules for fast browser load and PDF printing" && git push)
