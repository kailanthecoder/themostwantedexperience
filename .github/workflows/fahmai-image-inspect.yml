name: Inspect Platinum reference imagery
on:
  push:
    paths: ['.github/workflows/fahmai-image-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - run: python proposals/fah-mai/image-inspect.py
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add proposals/fah-mai/image-candidates.json
          git diff --cached --quiet || (git commit -m "Inspect source imagery" && git push)
