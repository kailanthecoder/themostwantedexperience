name: Inspect Fah Mai typography
on:
  push:
    paths: ['.github/workflows/fahmai-font.yml']
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - run: python proposals/fah-mai/font-inspect.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposals/fah-mai/font-inspection.json
          git diff --cached --quiet || (git commit -m "Inspect original Fah Mai website typography" && git push)
