name: Finish Fah Mai Examples A4 fit and final mobile regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fahmai-examples-fit-v24.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fahmai-examples-fit-v24
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Repair overflowing Examples cards and invalid image tags
        run: python proposals/fah-mai/examples_a4_fit_v24.py
      - name: Install browser test engines
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium webkit >/dev/null
      - name: Verify every page in Chromium and Safari WebKit
        run: python proposals/fah-mai/qa_mobile_reader_v23.py
      - name: Commit only when every A4 page fits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposals/fah-mai/index.html
          if git diff --cached --quiet; then echo "ALREADY_CURRENT"; exit 0; fi
          git commit -m "Keep all Fah Mai Examples content inside A4 and fix mobile asset loading"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "FINAL_RESPONSIVE_PROPOSAL_PUBLISHED"
              exit 0
            fi
            sleep 3
          done
          exit 1

# Diagnostic rerun: inspect exact Examples sheet box positions before changing layout
