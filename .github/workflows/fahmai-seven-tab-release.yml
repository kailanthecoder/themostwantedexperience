name: Fah Mai seven tabs — Louis, Kailan, Examples
on:
  push:
    paths: ['.github/workflows/fahmai-seven-tab-release.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install beautifulsoup4 playwright pillow pypdf requests
          python -m playwright install chromium
      - name: Patch proposal and capture live site examples
        run: python proposals/fah-mai/revise_seven_tabs.py
      - name: Verify seven tabs, A4 PDF and header alignment
        run: python proposals/fah-mai/verify_seven_tabs.py
      - name: Publish live proposal and PDF
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add proposals/fah-mai/index.html proposals/fah-mai/Fah-Mai-Seven-Tabs-A4.pdf proposals/fah-mai/Fah-Mai-Seven-Tabs-Contact.jpg proposals/fah-mai/Fah-Mai-Seven-Tabs-Contact.b64.txt proposals/fah-mai/Fah-Mai-Seven-Tabs-Mobile.png
          git diff --cached --quiet || (git commit -m "Publish seven-tab Fah Mai presentation addressed to Louis with portfolio examples" && git push)

# Rerun after ensuring apostrophes remain literal in headline
