name: Inspect actual section-header positions
on:
  push:
    paths: ['.github/workflows/fahmai-positions-inspect.yml']
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure header, separator, body and footer on A4
        run: |
          python -m pip install playwright -q
          python -m playwright install chromium >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          from playwright.async_api import async_playwright
          import asyncio
          async def run():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              for width in [1440,390]:
                page=await b.new_page(viewport={'width':width,'height':900})
                await page.goto(Path('proposals/fah-mai/index.html').resolve().as_uri(),wait_until='domcontentloaded')
                if width>800: await page.locator('#tab-budget').click()
                data=await page.evaluate("""()=>['overview','current','spec','budget','implementation','examples'].map(id=>{
                  const sheet=document.getElementById(id);
                  const nodes=[...sheet.children].map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {cl:e.className,top:Math.round(r.top-sheet.getBoundingClientRect().top),h:Math.round(r.height),bottom:Math.round(r.bottom-sheet.getBoundingClientRect().top),background:s.backgroundColor,display:s.display,position:s.position,overflow:s.overflow}});
                  return {id,children:nodes}
                })""")
                for row in data:print('BOUNDS',width,row)
                await page.close()
              await b.close()
          asyncio.run(run())
          PY