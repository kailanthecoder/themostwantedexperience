name: Release clean Fah Mai navigation
on:
  push:
    paths: ['.github/workflows/fahmai-fix-navigation-2026.yml']
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update exact seven-tab HTML without touching proposal pages
        run: python proposals/fah-mai/fix_navigation_2026.py
      - name: Browser check of desktop and mobile navigation
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def run():
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              for width in (995,390):
                page=await browser.new_page(viewport={'width':width,'height':900}, device_scale_factor=1)
                await page.goto(Path('proposals/fah-mai/index.html').resolve().as_uri(),wait_until='domcontentloaded',timeout=60000)
                await page.wait_for_timeout(600)
                d=await page.evaluate("""() => {
                  const pos=s=>{const e=document.querySelector(s); const r=e?.getBoundingClientRect();return r?{x:r.x,y:r.y,w:r.width,h:r.height}:null};
                  return {outer:pos('.toolbar'),brand:pos('.site-identity'),nav:pos('.proposal-sections'),pdf:pos('.pdf-btn'),buttons:document.querySelectorAll('.proposal-sections button').length,bodyScroll:document.documentElement.scrollWidth,viewport:innerWidth}
                }""")
                print('LAYOUT',width,d)
                assert d['buttons']==7, 'Six proposal sections and Examples needed'
                assert d['bodyScroll']<=width+4, 'Unexpected horizontal overflow'
                assert d['outer']['h']<=110, 'Too tall header'
                if width==995: assert abs(d['brand']['y']-d['nav']['y'])<20, 'Navigation wrapped on desktop'
                await page.locator('.toolbar').screenshot(path=f'/tmp/fahmai-nav-{width}.png')
                await page.locator('#tab-examples').click()
                assert await page.locator('#examples').is_visible(), 'Examples switching failed'
                await page.locator('#tab-overview').click()
                assert await page.locator('#overview').is_visible(), 'Returning to proposal failed'
                await page.close()
              await browser.close()
          asyncio.run(run())
          PY
      - name: Commit site update
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add proposals/fah-mai/index.html
          git diff --cached --quiet || (git commit -m "Replace cluttered proposal header with single-row editorial navigation" && git push)
