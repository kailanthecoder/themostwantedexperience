name: Inspect navigation overflow and Current screenshot toggles
on:
  push:
    paths: ['.github/workflows/fahmai-inspect-header-current-v16.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect header CSS and Current DOM
        run: |
          python -m pip install beautifulsoup4 playwright -q
          python -m playwright install chromium >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re,asyncio
          from playwright.async_api import async_playwright
          s=Path('proposals/fah-mai/index.html').read_text()
          d=BeautifulSoup(s,'html.parser')
          print('HTML',len(s),'STYLES',len(d.find_all('style')))
          nav=d.select_one('.toolbar')
          print('HEADER_HTML',str(nav)[:7000].replace('\n',' '))
          current=d.select_one('#current')
          body=current.select_one('.sheet-body')
          h=str(body)
          h=re.sub(r'data:image/[^" ]+','[data image]',h)
          print('CURRENT_HTML',h[:12000].replace('\n',' '))
          for term in ['ps-source-toggle','ps-source-button','ps-show-sites','ps-evidence','audit-v5-carousel','ps-report-image','data-ps-view','ps-report-dots']:
            matches=[m for m in re.finditer(re.escape(term),s)]
            print('TERM',term,len(matches))
            for m in matches[-5:]:print('TERM_CONTEXT',term,s[max(0,m.start()-300):m.start()+500].replace('\n',' ')[:820])
          allcss='\n'.join(el.get_text() for el in d.find_all('style'))
          for term in ['.toolbar','nav.tabs','.proposal-sections','.tabs-container','#tab-budget','#btn-export','.export-pdf','#tab-examples','.ps-source-toggle','.ps-evidence']:
            ms=[m for m in re.finditer(r'([^{}]{0,200})\{([^{}]{0,750})\}',allcss) if term in m.group(1)]
            print('CSS_COUNT',term,len(ms))
            for m in ms[-10:]:print('RULE',m.group(1).strip().replace('\n',' ')[:160],m.group(2).strip().replace('\n',' ')[:680])
          async def browser():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              for width in [1440,1050,1000,900,760,600,390,320]:
                pg=await b.new_page(viewport={'width':width,'height':850})
                await pg.goto(Path('proposals/fah-mai/index.html').resolve().as_uri(),wait_until='domcontentloaded')
                out=await pg.evaluate("""()=>{
                  const r=(e)=>{if(!e)return null;const v=e.getBoundingClientRect();const s=getComputedStyle(e);return {x:Math.round(v.x),right:Math.round(v.right),w:Math.round(v.width),h:Math.round(v.height),scrollWidth:e.scrollWidth,clientWidth:e.clientWidth,overflowX:s.overflowX,flex:s.flex,flexShrink:s.flexShrink,position:s.position,zIndex:s.zIndex,display:s.display}};
                  const t=document.querySelector('.toolbar');
                  const nav=document.querySelector('.toolbar nav.proposal-sections');
                  return {width:innerWidth,toolbar:r(t),toolbarChildren:[...t.children].map(e=>({cls:e.className,id:e.id,text:e.innerText?.slice(0,65),rect:r(e)})),nav:r(nav),
                   navChildren:nav?[...nav.children].map(e=>({id:e.id,text:e.innerText?.slice(0,30),rect:r(e)})):[],
                   budget:r(document.getElementById('tab-budget')),export:r(document.querySelector('.toolbar button[id*="export"],.toolbar .export-pdf')),
                   websiteToggle:document.querySelectorAll('#current .ps-source-toggle').length,siteCarousel:document.querySelectorAll('#current .audit-v5-carousel').length,pageSpeed:document.querySelectorAll('#current .ps-evidence').length,
                   globalOverflow:document.documentElement.scrollWidth>innerWidth+2};
                }""")
                print('GEOMETRY',out)
                await pg.close()
              await b.close()
          asyncio.run(browser())
          PY