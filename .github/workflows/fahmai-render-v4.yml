name: Render refined Fah Mai proposal
on:
  push:
    paths: ['.github/workflows/fahmai-render-v4.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and document checks
        run: |
          python -m pip install playwright pypdf pillow
          python -m playwright install chromium
      - name: Render tabs, print to A4 and check alignment
        run: |
          python - <<'PY'
          import pathlib,base64,io
          from playwright.sync_api import sync_playwright
          from PIL import Image, ImageOps, ImageDraw
          from pypdf import PdfReader
          d=pathlib.Path('proposals/fah-mai').resolve()
          snaps=[]
          with sync_playwright() as p:
           b=p.chromium.launch(headless=True)
           page=b.new_page(viewport={'width':1190,'height':1300},device_scale_factor=1)
           page.goto((d/'index.html').as_uri(),wait_until='domcontentloaded',timeout=60000)
           page.evaluate('() => document.fonts.ready')
           page.wait_for_timeout(700)
           for tab in ['overview','current','spec','proposed','budget','implementation']:
            page.locator('button[role=tab][data-tab='+tab+']').click(timeout=9000) if page.locator('button[role=tab][data-tab='+tab+']').count() else page.evaluate("(k) => { document.querySelectorAll('.sheet').forEach(e=>e.classList.toggle('is-active',e.id===k)) }",tab)
            page.wait_for_timeout(100)
            el=page.locator('article.sheet#'+tab)
            buf=el.screenshot()
            snaps.append(Image.open(io.BytesIO(buf)).convert('RGB'))
            metrics=page.evaluate("""(k) => {const q=document.getElementById(k),h=q.querySelector('.identity'),f=q.querySelector('.sheet-footer');return {tab:k,height:q.clientHeight,scroll:q.scrollHeight,header:h.getBoundingClientRect().height,footer:f.getBoundingClientRect().top,fonts:getComputedStyle(q.querySelector('h1')).fontFamily,logo:[...h.querySelectorAll('img')].map(x=>({alt:x.alt,ok:x.complete && x.naturalWidth>0,rect:[Math.round(x.getBoundingClientRect().top),Math.round(x.getBoundingClientRect().height)]}))}}""",tab)
            print('CHECK',metrics,flush=True)
           page.pdf(path=str(d/'Fah-Mai-Proposal-Refined.pdf'),format='A4',print_background=True,margin={'top':'0','right':'0','bottom':'0','left':'0'},prefer_css_page_size=True)
           b.close()
          assert len(PdfReader(d/'Fah-Mai-Proposal-Refined.pdf').pages)==6,'PDF is not six pages'
          print('PDF PAGE COUNT: 6')
          tw=405; th=round(tw*297/210)
          out=Image.new('RGB',(tw*3+64,th*2+80),'#edeaec')
          for i,im in enumerate(snaps):
           im.thumbnail((tw,th))
           x=16+(i%3)*(tw+16);y=16+(i//3)*(th+16)
           out.paste(im,(x,y))
          out.save(d/'Fah-Mai-Refined-Preview.jpg',quality=82,optimize=True)
          (d/'Fah-Mai-Refined-Preview.b64.txt').write_text(base64.b64encode((d/'Fah-Mai-Refined-Preview.jpg').read_bytes()).decode())
          PY
      - name: Publish print PDF and preview
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add proposals/fah-mai/Fah-Mai-Proposal-Refined.pdf proposals/fah-mai/Fah-Mai-Refined-Preview.jpg proposals/fah-mai/Fah-Mai-Refined-Preview.b64.txt
          git diff --cached --quiet || (git commit -m "Publish refined six-sheet A4 proposal PDF and previews" && git push)
