name: Inspect Fah Mai navigation
on:
  push:
    paths: ['.github/workflows/fahmai-nav-inspect-2026.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect toolbar and final nav logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('proposals/fah-mai/index.html').read_text()
          for a,b in [('<div class="toolbar"','<main '),('id="proposal-centered-navigation-2026"','</style>'),('const tabs=[...document.querySelectorAll', '</script>')]:
            i=s.find(a)
            if i<0:continue
            e=s.find(b,i+len(a))
            if e<0 or e-i>18000:e=i+18000
            print('BEGIN',a,'\n',s[i:e][:18000].replace('data:image/png;base64,','[IMAGE]'), '\nEND',a)
          PY
