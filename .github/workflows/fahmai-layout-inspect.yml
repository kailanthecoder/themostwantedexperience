name: Inspect Fah Mai layout for glass nav
on:
  push:
    paths: ['.github/workflows/fahmai-layout-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4
      - run: python proposals/fah-mai/inspect-current.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposals/fah-mai/inspect-current.json
          git diff --cached --quiet || (git commit -m "Inspect current proposal navigation" && git push)
