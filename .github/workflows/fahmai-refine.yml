name: Refine Fah Mai module design
on:
  push:
    paths: ['.github/workflows/fahmai-refine.yml']
permissions:
  contents: write
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - run: python proposals/fah-mai/refine.py
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add proposals/fah-mai/index.html
          git diff --cached --quiet || (git commit -m "Match Fah Mai fonts, rounded photo modules and aligned transparent logos" && git push)
