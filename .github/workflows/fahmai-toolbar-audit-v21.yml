name: Inspect Fah Mai sticky mobile toolbar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fahmai-toolbar-audit-v21.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install -q playwright
          python -m playwright install chromium >/dev/null 2>&1
      - run: |
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          uri=Path('proposals/fah-mai/index.html').resolve().as_uri()
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              page=await b.new_page(viewport={'width':390,'height':844})
              await page.goto(uri,wait_until='domcontentloaded')
              async def inspect(stage):
                x=await page.evaluate("""() => {
                  const sels=['html','body','.toolbar','.toolbar-inner','.nav-toprow','.view-switcher','.tool-actions','nav.tabs.proposal-sections','#tab-overview','#tab-budget'];
                  return sels.map(sel=>{
                    const e=document.querySelector(sel),s=getComputedStyle(e),r=e.getBoundingClientRect();
                    return {sel,rect:{top:r.top,bottom:r.bottom,height:r.height,width:r.width},scrollTop:e.scrollTop,scrollHeight:e.scrollHeight,clientHeight:e.clientHeight,display:s.display,position:s.position,overflowX:s.overflowX,overflowY:s.overflowY,height:s.height,minHeight:s.minHeight,gridRow:s.gridRow,gridColumn:s.gridColumn,gridTemplateRows:s.gridTemplateRows,flexWrap:s.flexWrap};
                  })
                }""")
                print('STAGE',stage,json.dumps(x,separators=(',',':')))
              await inspect('start')
              await page.locator('#tab-budget').click()
              await page.wait_for_timeout(100)
              await inspect('after_click')
              await b.close()
          asyncio.run(main())
          PY
