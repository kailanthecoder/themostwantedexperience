name: Publish COP tooling advance clarification
on:
  push:
    paths: ['.github/workflows/fahmai-release-cop-advance-v10.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply COP/advance language without adding to development quote
        run: python proposals/fah-mai/add_cop_advance_v10.py
      - name: Browser and A4 QA for copy, payments, page fit and PDF
        run: |
          python -m pip install playwright pypdf -q
          python -m playwright install chromium >/dev/null 2>&1
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from pypdf import PdfReader
          from playwright.async_api import async_playwright
          uri=Path('proposals/fah-mai/index.html').resolve().as_uri()
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              for width in (1440,900,390,320):
                page=await browser.new_page(viewport={'width':width,'height':940})
                errors=[]
                page.on('pageerror', lambda e:errors.append(str(e)))
                await page.goto(uri,wait_until='domcontentloaded',timeout=75000)
                await page.wait_for_timeout(100)
                data=await page.evaluate("""()=>{
                  const r=e=>{let x=e.getBoundingClientRect();return {y:x.y, bottom:x.bottom,height:x.height}};
                  const el=id=>document.getElementById(id);
                  const b=el('budget'),a=el('implementation'),c=el('implementation-evidence');
                  return {count:document.querySelectorAll('.viewport>.sheet').length,
                    mode:document.querySelector('.viewport').dataset.readingMode,
                    budgetText:b.textContent,implementationText:a.textContent,evidenceText:c.textContent,
                    budgetFooter:r(b.querySelector('.sheet-footer')),budgetLast:r(b.querySelector('.budgetv8-footer-notes')),
                    implementationFooter:r(a.querySelector('.sheet-footer')),implementationLast:r(a.querySelector('.launch-signoff')),
                    evidenceFooter:r(c.querySelector('.sheet-footer')),evidenceLast:r(c.querySelector('.launch-proof-terms')),
                    documentOverflow:document.documentElement.scrollWidth>innerWidth+2}
                }""")
                for label in ('budgetText','implementationText','evidenceText'):
                  assert '$305' in data[label],f'Advance missing from {label}'
                  assert '£2,750' in data[label] and '£3,000' in data[label],f'Milestone missing from {label}'
                for term in ('COP','Colombia','unused','£5,750'):
                  assert term.lower() in data['implementationText'].lower(), f'Missing COP explanation: {term}'
                assert 'unused' in data['evidenceText'].lower() or 'unspent' in data['evidenceText'].lower()
                assert '£10,550' in data['budgetText'] and '£400' in data['budgetText']
                assert data['count']==12 and not data['documentOverflow'],f'Broken document at width {width}'
                if width>800:
                  await page.locator('#tab-budget').click()
                  b=await page.evaluate("""()=>{const root=document.getElementById('budget');return {last:root.querySelector('.budgetv8-footer-notes').getBoundingClientRect().bottom,footer:root.querySelector('.sheet-footer').getBoundingClientRect().top}}""")
                  await page.locator('#tab-implementation').click()
                  g=await page.evaluate("""()=>['implementation','implementation-evidence'].map((id)=>{const root=document.getElementById(id);const last=root.querySelector(id==='implementation'?'.launch-signoff':'.launch-proof-terms');return {id,last:last.getBoundingClientRect().bottom,footer:root.querySelector('.sheet-footer').getBoundingClientRect().top}})""")
                  bounds=[{'id':'budget',**b}]+g
                else:
                  bounds=[{'id':k,'last':data[k+'Last']['bottom'],'footer':data[k+'Footer']['y']} for k in ('budget','implementation','evidence')]
                print('A4_BOUNDS',width,bounds)
                for g in bounds:
                  assert g['last']<=g['footer']-2, f'{width}: {g["id"]} content overlaps footer by {g["last"]-g["footer"]}px'
                if width>800:
                  await page.locator('#tab-implementation').click()
                  visible=await page.evaluate("""()=>[...document.querySelectorAll('.viewport>.sheet.is-active')].map(x=>x.id)""")
                  assert visible==['implementation','implementation-evidence'],f'Implementation spread broken: {visible}'
                  await page.locator('#tab-budget').click()
                  assert (await page.locator('#budget').is_visible())
                else:
                  assert data['mode']=='vertical'
                assert not errors,f'JavaScript console errors at {width}: {errors}'
                if width==1440:
                  await page.evaluate("window.dispatchEvent(new Event('beforeprint'))")
                  await page.emulate_media(media='print')
                  await page.pdf(path='/tmp/fahmai-cop-advance-v10.pdf',prefer_css_page_size=True,print_background=True)
                  n=len(PdfReader('/tmp/fahmai-cop-advance-v10.pdf').pages)
                  print('PRINTED_PAGES',n)
                  assert n==12,f'PDF changed to {n} pages'
                await page.close()
              await browser.close()
          asyncio.run(main())
          PY
      - name: Publish updated public proposal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposals/fah-mai/index.html
          git diff --cached --quiet || (git commit -m "Clarify $305 COP tooling advance and unused credit against contract" && git push)
