name: Release identical A4 proposal on mobile and desktop
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fahmai-identical-paper-v25.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fahmai-identical-paper-v25
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Keep A4 paper fixed, fix image loading, and fit Examples footers
        run: python proposals/fah-mai/fixed_paper_geometry_v25.py
      - name: Install mobile browser engines
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium webkit >/dev/null
      - name: Check all sheets fit viewport on mobile, tablet and desktop
        run: python proposals/fah-mai/qa_mobile_reader_v23.py
      - name: Assert identical intrinsic A4 typography and spacing on phones
        run: python proposals/fah-mai/qa_exact_paper_v25.py
      - name: Commit verified A4 site only after all tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposals/fah-mai/index.html
          if git diff --cached --quiet; then echo "ALREADY_VERIFIED"; exit 0; fi
          git commit -m "Preserve identical Fah Mai A4 layouts on all mobile and desktop viewports"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "IDENTICAL_A4_RELEASE_PUBLISHED"
              exit 0
            fi
            sleep 3
          done
          exit 1
