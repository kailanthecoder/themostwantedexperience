name: Quick inspect proposal reader sections
on:
  push:
    paths: ['.github/workflows/fahmai-inspect-quick-section.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print navigation and sheet heading markup
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('proposals/fah-mai/index.html').read_text()
          for term in ('<nav class="proposal-sections"','id="overview"','id="current"','id="spec"','id="budget"','id="implementation"','id="proposed"','id="examples"','fm-story-counter','<article'):
            print('TERM',term,'COUNT',s.count(term))
            ix=s.find(term)
            if ix>=0:
              print('CONTEXT',s[max(0,ix-210):ix+750].replace('\\n',' ')[:1000])
          for m in re.finditer(r'<article[^>]*class="[^"]*sheet[^"]*"[^>]*>',s):
            i=m.start()
            print('SHEET',m.group(0)[:270],s[i:i+950].replace('\\n',' ')[:950])
          for token in ['function updateTabs','function updateCounter','function goToPage','function navigateTo','const sectionMap','tab-spec','aria-selected','is-active','function updateToolbar']:
            p=s.find(token)
            print('LOGIC',token,'position',p,'context',s[max(0,p-350):p+1400].replace('\\n',' ')[:1650] if p>=0 else '')
          PY