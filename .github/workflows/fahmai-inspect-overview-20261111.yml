name: Inspect overview design details
on:
  push:
    paths: ['.github/workflows/fahmai-inspect-overview-20261111.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read cards and icon rows
        run: |
          python -m pip install beautifulsoup4 -q
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re
          html=Path('proposals/fah-mai/index.html').read_text()
          doc=BeautifulSoup(html,'html.parser')
          for selector in ['#overview .promise-grid','#overview .stage-runway','#overview .roadmap-callout']:
            el=doc.select_one(selector)
            print('BLOCK',selector)
            if el: print(str(el)[:6000])
          styles=[tag.get_text() for tag in doc.select('style')]
          for style in styles:
            for match in re.finditer(r'([^{}]{0,200})\{([^{}]{0,900})\}',style):
              name=match.group(1).strip()
              if any(k in name for k in ['promise-grid','stage-card','stage-runway','roadmap-callout','.promise{','.promise svg','.promise span']):
                print('RULE',name.replace('\n',' ')[:220],'=>',match.group(2).replace('\n',' ')[:800])
          PY
      - name: Measure stage boxes and benefits in desktop A4
        run: |
          python -m pip install playwright -q
          python -m playwright install chromium >/dev/null 2>&1
          python - <<'PY'
          import asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def go():
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              page=await browser.new_page(viewport={'width':1440,'height':980})
              await page.goto(Path('proposals/fah-mai/index.html').resolve().as_uri(),wait_until='domcontentloaded')
              result=await page.evaluate("""() => {
                const rect=e=>{let r=e.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}}
                const css=e=>{let s=getComputedStyle(e);return{gridTemplateColumns:s.gridTemplateColumns,gridTemplateRows:s.gridTemplateRows,padding:s.padding,gap:s.gap,align:s.alignItems,display:s.display,background:s.backgroundImage,backgroundColor:s.backgroundColor,color:s.color,border:s.border,shadow:s.boxShadow,borderRadius:s.borderRadius,font:s.font,lineHeight:s.lineHeight}}
                return Object.fromEntries(['.promise-grid','.stage-runway','.roadmap-callout'].map(sel=>{let p=document.querySelector('#overview '+sel);return [sel,p?{rect:rect(p),style:css(p),children:[...p.children].map(e=>({text:e.textContent.trim(),rect:rect(e),style:css(e)}))}:null]}))
              }""")
              print('MEASURE',result)
              await browser.close()
          asyncio.run(go())
          PY
