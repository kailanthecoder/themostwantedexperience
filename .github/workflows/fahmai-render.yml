name: Render verified Fah Mai proposal
on:
  push:
    paths: ['.github/workflows/fahmai-render.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python -m pip install playwright pypdf
          python -m playwright install chromium
      - name: Render desktop screenshot and true A4 PDF
        run: |
          python - <<'PY'
          import pathlib
          from playwright.sync_api import sync_playwright
          from pypdf import PdfReader
          d=pathlib.Path('proposals/fah-mai').resolve()
          src=d/'index.html'
          with sync_playwright() as p:
           b=p.chromium.launch(headless=True)
           page=b.new_page(viewport={'width':1190,'height':940},device_scale_factor=1)
           page.goto(src.as_uri(),wait_until='domcontentloaded',timeout=60000)
           page.screenshot(path=str(d/'verified-header.png'),full_page=False)
           print('HEADER IMAGES',page.evaluate('''() => [...document.querySelectorAll('.sheet.is-active .identity img')].map(i=>({alt:i.alt,w:i.naturalWidth,h:i.naturalHeight,complete:i.complete}))'''))
           page.pdf(path=str(d/'Fah-Mai-Proposal-Verified.pdf'),format='A4',print_background=True,margin={'top':'0','right':'0','bottom':'0','left':'0'},prefer_css_page_size=True)
           b.close()
          print('A4 PDF PAGES',len(PdfReader(d/'Fah-Mai-Proposal-Verified.pdf').pages))
          PY
      - name: Publish corrected PDF and preview
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add proposals/fah-mai/verified-header.png proposals/fah-mai/Fah-Mai-Proposal-Verified.pdf
          git diff --cached --quiet || (git commit -m "Render A4 PDF with verified logos" && git push)
