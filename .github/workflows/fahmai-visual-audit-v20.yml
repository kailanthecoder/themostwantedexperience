name: Audit Fah Mai mobile visuals and page clipping
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fahmai-visual-audit-v20.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install -q playwright
          python -m playwright install chromium >/dev/null 2>&1
      - name: Capture current reader and page geometry
        run: |
          python - <<'PY'
          import asyncio,base64,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          src=Path('proposals/fah-mai/index.html').resolve().as_uri()
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              page=await b.new_page(viewport={'width':390,'height':844},device_scale_factor=1)
              await page.goto(src,wait_until='domcontentloaded')
              await page.wait_for_timeout(500)
              print('IMAGE_START_OVERVIEW='+base64.b64encode(await page.screenshot(type='jpeg',quality=45)).decode())
              await page.locator('#tab-budget').click()
              await page.wait_for_timeout(250)
              print('IMAGE_START_BUDGET='+base64.b64encode(await page.screenshot(type='jpeg',quality=45)).decode())
              for width,height in [(390,844),(768,1024),(1440,900)]:
                await page.set_viewport_size({'width':width,'height':height})
                await page.wait_for_timeout(150)
                data=await page.evaluate("""() => {
                  const sheets=[...document.querySelectorAll('.viewport > .sheet')];
                  return sheets.map((s,i)=>{
                    const x=s.getBoundingClientRect();
                    const body=s.querySelector('.sheet-body');
                    const footer=s.querySelector('.sheet-footer');
                    const br=body?.getBoundingClientRect(), fr=footer?.getBoundingClientRect();
                    const leaf=[...s.querySelectorAll('p,h1,h2,h3,h4,li,.ps-v17-evidence,.budgetv8-quotation,.budgetv8-rate-tables,.specv6-capability')].filter(e=>e.getBoundingClientRect().height>1);
                    const past=leaf.filter(e=>e.getBoundingClientRect().bottom > x.bottom - 4 && e.getBoundingClientRect().top<x.bottom);
                    const collides=leaf.filter(e=>fr && e.getBoundingClientRect().bottom > fr.top + 3 && e.getBoundingClientRect().top < fr.top);
                    return {id:s.id,display:getComputedStyle(s).display,pageW:Math.round(x.width),pageH:Math.round(x.height),bodyBottom:Math.round(br?.bottom??0),footerTop:Math.round(fr?.top??0),clipContent:past.slice(0,7).map(e=>e.className||e.tagName),overFooter:collides.slice(0,7).map(e=>e.className||e.tagName)};
                  });
                }""")
                print('GEOMETRY',width,json.dumps(data,separators=(',',':')))
              await b.close()
          asyncio.run(main())
          PY
