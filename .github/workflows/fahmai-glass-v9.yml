name: Fah Mai glass navigation and web proposal rewrite
on:
  push:
    paths: ['.github/workflows/fahmai-glass-v9.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install layout test dependencies
        run: |
          python -m pip install beautifulsoup4 playwright pillow pypdf
          python -m playwright install chromium
      - name: Apply copy, sixth Proposals tab and responsive glass navigation
        run: python proposals/fah-mai/glass-v9.py
      - name: Run desktop/mobile layout tests and print A4 PDF
        run: python proposals/fah-mai/test-glass-v9.py
      - name: Publish corrected HTML and PDF
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add proposals/fah-mai/index.html proposals/fah-mai/Fah-Mai-Proposal-Glass.pdf proposals/fah-mai/Fah-Mai-Glass-Mobile.jpg proposals/fah-mai/Fah-Mai-Glass-Desktop.jpg proposals/fah-mai/Fah-Mai-Glass-Desktop.b64.txt proposals/fah-mai/Fah-Mai-Glass-Mobile.b64.txt
          git diff --cached --quiet || (git commit -m "Publish sixth Proposals tab, glass navigation and stronger 2026 pitch" && git push)

# Rebuild with the mobile visual regression check
