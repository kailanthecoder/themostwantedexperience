name: Check NW IL Autoglass live preview
on:
  push:
    paths: ['.github/workflows/fahmai-check-autoglass-preview.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official site and thumbnail preview
        run: |
          python -m pip install requests pillow -q
          python - <<'PY'
          import requests,base64,io
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image,ImageStat
          links=[
          'https://nwilautoglass.com/',
          'https://www.nwilautoglass.com/',
          'http://nwilautoglass.com/',
          'https://image.thum.io/get/noanimate/width/720/crop/580/https://nwilautoglass.com/',
          'https://s.wordpress.com/mshots/v1/https%3A%2F%2Fnwilautoglass.com%2F?w=720',
          ]
          def probe(u):
            try:
              r=requests.get(u,timeout=18,headers={'User-Agent':'Mozilla/5.0'})
              print('STATUS',u,r.status_code,'SIZE',len(r.content),'TYPE',r.headers.get('content-type'),'FINAL',r.url)
              if 'image/' in r.headers.get('content-type','') and len(r.content)>2500:
                im=Image.open(io.BytesIO(r.content)).convert('RGB')
                print('IMAGE',u,im.size,'MEAN',tuple(round(v) for v in ImageStat.Stat(im).mean))
                im.thumbnail((350,175))
                b=io.BytesIO();im.save(b,format='JPEG',quality=55)
                print('PREVIEW_BASE64',u,base64.b64encode(b.getvalue()).decode('ascii'))
              elif 'text' in r.headers.get('content-type',''):
                text=r.text
                import re
                title=re.search(r'<title>(.*?)</title>',text,re.I|re.S)
                print('TITLE',u,title.group(1) if title else None,'HEAD',text[:320].replace('\n',' '))
            except Exception as e:
              print('ERROR',u,type(e).__name__,str(e)[:200])
          with ThreadPoolExecutor(max_workers=5) as pool: list(pool.map(probe,links))
          PY
