name: Inspect book portrait and first A4 sheet
on:
  push:
    paths: ['.github/workflows/fahmai-portrait-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python proposals/fah-mai/portrait-inspection.py
      - name: Store inspection results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposals/fah-mai/portrait-source-*.jpg proposals/fah-mai/portrait-source-*.b64.txt proposals/fah-mai/portrait-candidates.json proposals/fah-mai/overview-dom-inspection.json
          git diff --cached --quiet || (git commit -m "Inspect first page and official booking-site portrait" && git push)
