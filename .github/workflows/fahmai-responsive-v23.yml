name: Repair and verify Fah Mai responsive A4 reader
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fahmai-responsive-v23.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fahmai-responsive-v23
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive single-sheet reader and asset optimisation
        run: python proposals/fah-mai/mobile_reader_stability_v23.py
      - name: Install Chromium and WebKit test dependencies
        run: |
          python -m pip install -q playwright
          python -m playwright install --with-deps chromium webkit >/dev/null
      - name: Verify Overview boot, controls, 12 pages and viewport fit
        run: python proposals/fah-mai/qa_mobile_reader_v23.py
      - name: Commit only after browser QA passes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposals/fah-mai/index.html proposals/fah-mai/assets
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            exit 0
          fi
          git commit -m "Fix mobile A4 pagination, Overview startup and responsive page fit; optimize image loading"
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "REPAIRED_BUILD_PUBLISHED_TO_MAIN"
              exit 0
            fi
            sleep 3
          done
          exit 1
